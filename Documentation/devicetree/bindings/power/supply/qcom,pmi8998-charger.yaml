%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pmi8998-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMI8998/PM660 Switch-Mode Battery Charger "2"

maintainers:
  - Casey Connolly <casey.connolly@linaro.org>

properties:
  compatible:
    enum:
      - qcom,pm7250b-charger
      - qcom,pm8150b-charger
      - qcom,pmi8998-charger
      - qcom,pm660-charger

  reg:
    maxItems: 1

  interrupts:
    maxItems: 4

  interrupt-names:
    items:
      - const: usb-plugin
      - const: bat-ov
      - const: wdog-bark
      - const: usbin-icl-change

  io-channels:
    items:
      - description: USB in current in uA
      - description: USB in voltage in uV

  io-channel-names:
    items:
      - const: usbin_i
      - const: usbin_v

  monitored-battery: true

  qcom,jeita-soft-thresholds:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      Battery thermistor readings, as codes of the charger's ADC, of the cool and the warm soft JEITA
      threshold. Below the cool and above the warm threshold the charger applies the first and the second
      value of qcom,jeita-soft-fcc-microamp and qcom,jeita-soft-fv-microvolt.
    minItems: 2
    maxItems: 2
    items:
      maximum: 0xffff

  qcom,jeita-soft-fcc-microamp:
    description: Fast charge current below the cool and above the warm threshold.
    minItems: 2
    maxItems: 2

  qcom,jeita-soft-fv-microvolt:
    description:
      Float voltage below the cool and above the warm threshold. The first value must equal the float
      voltage outside the soft zones.
    minItems: 2
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery

dependentRequired:
  qcom,jeita-soft-thresholds: [ 'qcom,jeita-soft-fcc-microamp', 'qcom,jeita-soft-fv-microvolt' ]
  qcom,jeita-soft-fcc-microamp: [ 'qcom,jeita-soft-thresholds' ]
  qcom,jeita-soft-fv-microvolt: [ 'qcom,jeita-soft-thresholds' ]

allOf:
  - $ref: power-supply.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      #address-cells = <1>;
      #size-cells = <0>;

      charger@1000 {
        compatible = "qcom,pmi8998-charger";
        reg = <0x1000>;

        interrupts = <0x2 0x12 0x2 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x13 0x4 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x13 0x6 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x16 0x1 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "usb-plugin", "bat-ov", "wdog-bark", "usbin-icl-change";

        io-channels = <&pmi8998_rradc 3>,
                      <&pmi8998_rradc 4>;
        io-channel-names = "usbin_i",
                           "usbin_v";

        monitored-battery = <&battery>;
      };
    };
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      #address-cells = <1>;
      #size-cells = <0>;

      charger@1000 {
        compatible = "qcom,pm7250b-charger";
        reg = <0x1000>;

        interrupts = <0x2 0x13 0x4 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x12 0x2 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x16 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x13 0x7 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "usb-plugin", "bat-ov", "wdog-bark", "usbin-icl-change";

        io-channels = <&pm7250b_adc 7>,
                      <&pm7250b_adc 8>;
        io-channel-names = "usbin_i",
                           "usbin_v";

        monitored-battery = <&battery>;
        qcom,jeita-soft-thresholds = <0x3f46 0x20b8>;
        qcom,jeita-soft-fcc-microamp = <450000 1000000>;
        qcom,jeita-soft-fv-microvolt = <4400000 4100000>;
      };
    };
