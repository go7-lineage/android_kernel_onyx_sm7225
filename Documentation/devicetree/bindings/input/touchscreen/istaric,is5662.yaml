%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/istaric,is5662.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Istaric IS5662 capacitive touchscreen controller

maintainers:
  - ui-1 <134524800+ui-1@users.noreply.github.com>

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: istaric,is5662

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply: true
  vcc-supply: true

  vdd-enable-gpios:
    description: Board switch in front of the VDD (logic) supply.
    maxItems: 1

  vcc-enable-gpios:
    description: Board switch in front of the VCC (sensor) supply.
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@55 {
            compatible = "istaric,is5662";
            reg = <0x55>;
            interrupts-extended = <&tlmm 22 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 21 GPIO_ACTIVE_LOW>;
            touchscreen-size-x = <1264>;
            touchscreen-size-y = <1680>;
        };
    };
