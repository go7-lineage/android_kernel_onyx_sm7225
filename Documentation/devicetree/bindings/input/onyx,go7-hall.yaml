%YAML 1.2
---
$id: http://devicetree.org/schemas/input/onyx,go7-hall.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Onyx Boox Go 7 cover sensor

maintainers:
  - ui-1 <134524800+ui-1@users.noreply.github.com>

description:
  Sensor for the folio cover. Closing the cover reports KEY_POWER, opening it reports KEY_WAKEUP.

properties:
  compatible:
    const: onyx,go7-hall

  irq-gpios:
    description: Sensor output; low = cover closed.
    maxItems: 1

  vdd-supply: true

  onyx,send-alt-key:
    type: boolean
    description: Wrap each key in KEY_LEFTALT down/up.

required:
  - compatible
  - irq-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    hall-sensor {
        compatible = "onyx,go7-hall";
        irq-gpios = <&tlmm 99 GPIO_ACTIVE_HIGH>;
    };
